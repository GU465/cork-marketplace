services:
  - type: web
    name: cork-marketplace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind=0.0.0.0:$PORT --timeout 600 server:app
    envVars:
      - key: MOD_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PYTHON_VERSION
        value: 3.12.7
    disk:
      name: marketplace-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
